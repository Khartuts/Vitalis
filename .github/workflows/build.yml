# Reproducible builds and tests on real Windows / Linux runners.
# Covers what the Linux development container could not: running the bundled Windows engine (NumPy/SciPy)
# and installing the NSIS installer on Windows.
name: build-and-test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install engine
        working-directory: services/engine
        run: |
          python -m pip install -r requirements.lock.txt pytest httpx
          python -m pip install -e .
      - name: Run engine tests
        working-directory: services/engine
        run: python -m pytest -q

  desktop-and-installer:
    runs-on: windows-2022
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Bundle Windows engine runtime
        shell: bash
        run: HOSTPY=python scripts/build-windows-runtime.sh
      - name: Smoke-test bundled engine (stdio JSON-RPC)
        shell: bash
        run: python scripts/smoke_engine.py runtime/engine/python/python.exe
      - name: Desktop unit tests and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Silent install check
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "apps/desktop/release/VITALIS-Setup-0.1.0-x64.exe" -ArgumentList "/S"
          $p = Join-Path $env:LOCALAPPDATA "Programs/VITALIS/resources/engine/python/python.exe"
          if (!(Test-Path $p)) { throw "engine runtime not installed at $p" }
          & $p -I -c "import numpy, scipy, pandas, statsmodels, sqlcipher3, vitalis_engine; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-windows-installer
          path: apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint and APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-companion-apk
          path: apps/android/app/build/outputs/apk/**/*.apk
