# Reproducible builds and tests on real Windows / Linux runners.
# Publishing to GitHub Releases (Windows installer + Android APKs) happens either when a tag like v0.1.0 is pushed, or
# from the Actions tab: build-and-test → Run workflow → enter a release tag. The release job then creates that tag on
# the tested commit.
name: build-and-test
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag after all tests pass (e.g. v0.1.0). Empty: build and test only."
        required: false
        default: ""

jobs:
  engine-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install engine
        working-directory: services/engine
        run: |
          python -m pip install -r requirements.lock.txt pytest httpx
          python -m pip install -e .
      - name: Run engine tests
        working-directory: services/engine
        run: python -m pytest -rN

  # The phone app runs the same engine on Python 3.10 with older package versions (the Android builds available).
  engine-tests-android-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install the Android-compatible package set
        working-directory: services/engine
        run: python -m pip install -r requirements.android-compat.txt pytest httpx
      - name: Run engine tests (engine on PYTHONPATH; pyproject targets the desktop's Python)
        working-directory: services/engine
        run: PYTHONPATH=$PWD python -m pytest -rN

  desktop-and-installer:
    runs-on: windows-2022
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Bundle Windows engine runtime (includes a self-test of the bundled interpreter)
        shell: bash
        run: HOSTPY=python scripts/build-windows-runtime.sh
      - name: Smoke-test bundled engine (stdio JSON-RPC)
        shell: bash
        run: python scripts/smoke_engine.py runtime/engine/python/python.exe
      # bash (-e -o pipefail) so that every command's failure fails the step (pwsh only checks the last one).
      - name: Desktop typecheck, unit tests and build
        working-directory: apps/desktop
        shell: bash
        env:
          VITALIS_PYTHON: ${{ github.workspace }}\runtime\engine\python\python.exe
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: End-to-end test of the desktop app on Windows (real Electron, bundled engine, mock AI server)
        working-directory: apps/desktop
        shell: bash
        env:
          VITALIS_PYTHON: ${{ github.workspace }}\runtime\engine\python\python.exe
          E2E_SHOTS: ${{ runner.temp }}\e2e-shots
        run: |
          npm install --no-save playwright@1.63.0
          node tests/e2e/app.e2e.mjs
      - name: Build NSIS installer and portable ZIP
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --win --x64 --publish never
      - name: Silent install, smoke-test the installed engine, drive the installed app
        shell: pwsh
        env:
          E2E_SHOTS: ${{ runner.temp }}\e2e-shots
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem apps/desktop/release/VITALIS-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList "/S"
          $root = Join-Path $env:LOCALAPPDATA "Programs\VITALIS"
          $app = Join-Path $root "VITALIS.exe"
          $py = Join-Path $root "resources\engine\python\python.exe"
          if (-not (Test-Path $app)) { Get-ChildItem $root -ErrorAction SilentlyContinue; throw "installed app not found: $app" }
          if (-not (Test-Path $py)) { throw "installed engine runtime not found: $py" }
          python scripts/smoke_engine.py $py
          if ($LASTEXITCODE -ne 0) { throw "installed engine smoke test failed" }
          node apps/desktop/tests/e2e/installed.e2e.mjs $app
          if ($LASTEXITCODE -ne 0) { throw "installed app test failed" }
      - name: Unzip the portable build and drive it
        shell: pwsh
        env:
          E2E_SHOTS: ${{ runner.temp }}\e2e-shots\portable
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem apps/desktop/release/VITALIS-*-win-x64-portable.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          $app = Join-Path $dest "VITALIS.exe"
          if (-not (Test-Path $app)) { Get-ChildItem $dest; throw "VITALIS.exe not at the top of the portable ZIP" }
          node apps/desktop/tests/e2e/installed.e2e.mjs $app
          if ($LASTEXITCODE -ne 0) { throw "portable app test failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-windows-portable
          path: apps/desktop/release/*-portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Android SDK packages (runner's preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, lint and APKs
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-companion-apk
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Android builds of the engine's native packages, the full phone app, and its on-device tests (emulator).
  phone-app:
    uses: ./.github/workflows/android-wheels.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [desktop-and-installer, android, phone-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "release tag must look like v0.1.0, got: $TAG"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Collect files and checksums
        run: |
          mkdir -p out
          find dist -name "*.exe" -exec cp {} out/ \;
          find dist -name "*-portable.zip" -exec cp {} out/ \;
          cp "$(find dist -name 'app-debug.apk' | head -1)" "out/VITALIS-Companion-${TAG}-debug.apk"
          cp "$(find dist -name 'app-release-unsigned.apk' | head -1)" "out/VITALIS-Companion-${TAG}-release-unsigned.apk"
          cp "$(find dist -name 'VITALIS-Companion-engine-preview-arm64.apk' | head -1)" "out/VITALIS-Phone-${TAG}-preview-arm64.apk"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VITALIS ${{ env.TAG }}
          files: out/*
          body: |
            VITALIS ${{ env.TAG }}

            * `VITALIS-Setup-*-x64.exe` — Windows 11 installer (unsigned: SmartScreen → More info → Run anyway).
            * `VITALIS-*-win-x64-portable.zip` — the same app without an installer: extract the whole ZIP, run `VITALIS.exe`.
            * `VITALIS-Companion-*-debug.apk` — Android companion, debug-signed, sideloadable.
            * `VITALIS-Companion-*-release-unsigned.apk` — release build; sign it with your own key.
            * `VITALIS-Phone-*-preview-arm64.apk` — PREVIEW: the companion plus full VITALIS on the phone (on-phone
              engine, ~120 MB). Replaces the companion (uninstall it first). Tested on an Android 14 emulator only.
            * `SHA256SUMS.txt` — checksums.

            Built and tested by the build-and-test workflow on GitHub-hosted runners: engine tests on Linux and Windows;
            desktop unit and end-to-end tests on Windows; the installer is silently installed on Windows, its bundled
            engine smoke-tested and the installed app driven through demo-profile creation and every screen.
            Android unit tests, lint and builds on Linux (not run on a phone). See INSTALLATION.md and TESTING.md.
            Not a medical device.
