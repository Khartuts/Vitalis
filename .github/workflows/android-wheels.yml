# Builds the two Python packages the engine needs on Android that have no published Android build:
#   * pydantic_core (Rust)  — input validation
#   * sqlcipher3 (C)        — the encrypted database
# for Chaquopy's Python 3.10 (the newest Python with Android builds of SciPy, statsmodels and scikit-learn).
#
# Isolation: read-only token, no secrets, Chaquopy's build tool pinned to one commit, Python-for-Android downloaded
# from Maven Central with plain requests and SHA-1 checked against Maven's published checksums.
name: android-wheels
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths: # the wheels, the app and the engine it bundles
      - "apps/android/**"
      - "services/engine/vitalis_engine/**"
      - ".github/workflows/android-wheels.yml"

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [pydantic-core, sqlcipher3]
        abi: [arm64-v8a, x86_64] # phones / emulator
    env:
      CHAQUOPY_REF: 1f63c93d8beaf7062fbe51888ab9235475df3bb8 # release 17.2.0 (same as the app's Gradle plugin)
      TARGET_VERSION: 3.10.22-0
    steps:
      - uses: actions/checkout@v4
      - name: Chaquopy build tool (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ env.CHAQUOPY_REF }}
          path: chaquopy
          persist-credentials: false
          sparse-checkout: |
            server/pypi
            target
      - name: Apply VITALIS patch to the build tool (see apps/android/python-wheels/chaquopy-build-wheel.patch)
        working-directory: chaquopy
        run: patch -p1 < "$GITHUB_WORKSPACE/apps/android/python-wheels/chaquopy-build-wheel.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.12
      - name: Python-for-Android ${{ env.TARGET_VERSION }} from Maven Central (checksum-verified)
        run: |
          d=chaquopy/maven/com/chaquo/python/target/$TARGET_VERSION
          mkdir -p "$d"
          base=https://repo1.maven.org/maven2/com/chaquo/python/target/$TARGET_VERSION
          for f in "target-$TARGET_VERSION.pom" "target-$TARGET_VERSION-${{ matrix.abi }}.zip"; do
            curl -fsSL --retry 4 -o "$d/$f" "$base/$f"
            sha=$(curl -fsSL --retry 4 "$base/$f.sha1" | cut -c1-40)
            echo "$sha  $d/$f" | sha1sum -c -
          done
      - name: Build tools
        run: |
          sudo apt-get install -y patchelf
          python3.12 -m venv "$RUNNER_TEMP/bw"
          "$RUNNER_TEMP/bw/bin/pip" install -q -r chaquopy/server/pypi/requirements.txt
          rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
          # PyO3 description of Chaquopy's CPython 3.10 for Android (used by non-abi3 Rust extensions).
          printf '%s\n' implementation=CPython version=3.10 shared=true abi3=false lib_name=python3.10 \
            pointer_width=64 build_flags= suppress_build_script_link_lines=false > /tmp/pyo3-android-cp310.cfg
          cat /tmp/pyo3-android-cp310.cfg
      - name: Build ${{ matrix.package }} for ${{ matrix.abi }}
        working-directory: chaquopy/server/pypi
        run: |
          # The tool's compiler wrapper only keeps -I/-L paths inside the Chaquopy checkout, so the recipes
          # are staged under packages/ (building from an outside path strips the OpenSSL and libpython paths).
          cp -r "$GITHUB_WORKSPACE/apps/android/python-wheels/recipes/${{ matrix.package }}" packages/
          export PATH="$RUNNER_TEMP/bw/bin:$PATH" # the tool calls `wheel pack` from its own environment
          "$RUNNER_TEMP/bw/bin/python" build-wheel.py --python 3.10 --abi ${{ matrix.abi }} ${{ matrix.package }}
          find dist -name "*.whl" -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.abi }}
          path: chaquopy/server/pypi/dist/**/*.whl
          if-no-files-found: error

  # The engine-enabled app on an Android emulator: the real engine, encrypted DB, demo data, overview.
  phone-engine:
    needs: wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: apps/android/python-wheels/dist
          merge-multiple: true
      - run: find apps/android/python-wheels/dist -name "*.whl" | sort
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" } # Chaquopy's build Python must match the app's Python
      - name: Android SDK packages (runner's preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build the engine-enabled APKs (phone arm64 + emulator x86_64 test)
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pvitalis.engine=true -Pvitalis.abis=arm64-v8a :app:assembleDebug
          mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/VITALIS-Companion-engine-preview-arm64.apk"
          ls -la "$RUNNER_TEMP/apk"
          ./gradlew --no-daemon -Pvitalis.engine=true -Pvitalis.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On-device engine test (Android 14 emulator, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          working-directory: apps/android
          script: |
            ./gradlew --no-daemon -Pvitalis.engine=true -Pvitalis.abis=x86_64 :app:connectedDebugAndroidTest || (adb logcat -d -s VitalisEngineTest python.stderr python.stdout AndroidRuntime TestRunner > "$RUNNER_TEMP/logcat.txt"; exit 1)
            adb logcat -d -s VitalisEngineTest python.stderr python.stdout > "$RUNNER_TEMP/logcat.txt" || true
      - if: always()
        run: cat "$RUNNER_TEMP/logcat.txt" 2>/dev/null | tail -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-engine-test-report
          path: |
            apps/android/app/build/reports/androidTests/
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-companion-engine-preview-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
