# Builds the two Python packages the engine needs on Android that have no published Android build:
#   * pydantic_core (Rust)  — input validation
#   * sqlcipher3 (C)        — the encrypted database
# for Chaquopy's Python 3.10 (the newest Python with Android builds of SciPy, statsmodels and scikit-learn).
#
# Isolation: read-only token, no secrets, Chaquopy's build tool pinned to one commit, Python-for-Android downloaded
# from Maven Central with plain requests and SHA-1 checked against Maven's published checksums.
name: android-wheels
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "apps/android/python-wheels/**"
      - ".github/workflows/android-wheels.yml"

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [pydantic-core, sqlcipher3]
        abi: [arm64-v8a, x86_64] # phones / emulator
    env:
      CHAQUOPY_REF: 502ad46fe81532150b74fb6d299c4d85f5c61b03
      TARGET_VERSION: 3.10.22-0
    steps:
      - uses: actions/checkout@v4
      - name: Chaquopy build tool (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ env.CHAQUOPY_REF }}
          path: chaquopy
          persist-credentials: false
          sparse-checkout: |
            server/pypi
            target
      - name: Apply VITALIS patch to the build tool (see apps/android/python-wheels/chaquopy-build-wheel.patch)
        working-directory: chaquopy
        run: patch -p1 < "$GITHUB_WORKSPACE/apps/android/python-wheels/chaquopy-build-wheel.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.12
      - name: Python-for-Android ${{ env.TARGET_VERSION }} from Maven Central (checksum-verified)
        run: |
          d=chaquopy/maven/com/chaquo/python/target/$TARGET_VERSION
          mkdir -p "$d"
          base=https://repo1.maven.org/maven2/com/chaquo/python/target/$TARGET_VERSION
          for f in "target-$TARGET_VERSION.pom" "target-$TARGET_VERSION-${{ matrix.abi }}.zip"; do
            curl -fsSL --retry 4 -o "$d/$f" "$base/$f"
            sha=$(curl -fsSL --retry 4 "$base/$f.sha1" | cut -c1-40)
            echo "$sha  $d/$f" | sha1sum -c -
          done
      - name: Build tools
        run: |
          sudo apt-get install -y patchelf
          python3.12 -m venv "$RUNNER_TEMP/bw"
          "$RUNNER_TEMP/bw/bin/pip" install -q -r chaquopy/server/pypi/requirements.txt
          rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
          # PyO3 description of Chaquopy's CPython 3.10 for Android (used by non-abi3 Rust extensions).
          printf '%s\n' implementation=CPython version=3.10 shared=true abi3=false lib_name=python3.10 \
            pointer_width=64 build_flags= suppress_build_script_link_lines=false > /tmp/pyo3-android-cp310.cfg
          cat /tmp/pyo3-android-cp310.cfg
      - name: Build ${{ matrix.package }} for ${{ matrix.abi }}
        working-directory: chaquopy/server/pypi
        run: |
          # The tool's compiler wrapper only keeps -I/-L paths inside the Chaquopy checkout, so the recipes
          # are staged under packages/ (building from an outside path strips the OpenSSL and libpython paths).
          cp -r "$GITHUB_WORKSPACE/apps/android/python-wheels/recipes/${{ matrix.package }}" packages/
          "$RUNNER_TEMP/bw/bin/python" build-wheel.py --python 3.10 --abi ${{ matrix.abi }} ${{ matrix.package }}
          find dist -name "*.whl" -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.abi }}
          path: chaquopy/server/pypi/dist/**/*.whl
          if-no-files-found: error
