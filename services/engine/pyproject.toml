[project]
name = "vitalis-engine"
version = "0.1.0"
description = "VITALIS local analytics engine (encrypted storage, deterministic health analytics, AI tool layer)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14.4", "scikit-learn>=1.5",
  "pydantic>=2.9", "fastapi>=0.115", "uvicorn>=0.32", "sqlcipher3>=0.6.5", "cryptography>=43", "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
